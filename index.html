<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number!..</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .bg{
            background-color: blueviolet;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            background-color: whitesmoke;
            width: 450px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }
        .id{
            color:blueviolet;
            font-size: 30px;
            margin-top: 10px;
            margin-bottom: 10px;
            font-family:Georgia, 'Times New Roman', Times, serif
        }
        #input{
            color:blueviolet;
            background-color: whitesmoke;
            font-size: 30px;
            width: 90%;
            height: 30px;
            border-radius: 5px;
            margin-top: 10px;
            margin-bottom: 10px;
            box-shadow: 2px 3px 10px 1px blueviolet;
        }
        #btn{
            background-color: blueviolet;
            color: whitesmoke;
            border-radius: 3px;
            font-size: 20px;
            padding: 2px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        #txt{
            font-size: 25px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="box">
            <h1 class="id">Guess The Number😎</h1>
            <input id = "input" type="text" placeholder="Guess a Number....">
            <button id = "btn" onclick="onGuessBtn()">Guess!🤔</button>
            <p id = "txt"></p>
            <p id = "chance"></p>
        </div>
    </div>
    <script src = "index.js"></script>
</body>
</html>
